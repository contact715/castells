<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/castells-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Castells Media - We help contractors and service providers dominate their local markets through data-driven strategies." />

    <!-- Resource Hints for Performance -->
    <!-- Оба шрифта лежат у нас (/fonts). К чужим серверам за шрифтами не ходим:
         раньше основной текст ждал двух остановок на fontshare.com -->
    <link rel="dns-prefetch" href="https://player.vimeo.com" />

    <!-- Preload critical resources -->
    <link rel="preload" href="/castells-logo.webp" as="image" type="image/webp" />
    <!-- Заголовки первого экрана набраны Literata: грузим его сразу,
         не дожидаясь, пока браузер дочитает CSS и наткнётся на @font-face -->
    <link rel="preload" href="/fonts/literata-variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Главным элементом страницы (LCP) браузер считает абзац под заголовком,
         а он набран Figtree. После обрезки шрифт весит 11 КБ, так что грузить
         его заранее дешевле, чем ждать разбора стилей -->
    <link rel="preload" href="/fonts/figtree-variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Курсив («local markets» в первом экране) оставался последним длинным
         звеном цепочки: 986 мс по замеру PageSpeed, потому что браузер узнавал
         о нём только разобрав стили. Предзагрузку уже пробовали, когда файл
         весил 63 КБ — тогда он забивал канал и делал хуже. После обрезки
         в нём 13.85 КБ, и очередь он больше не занимает. -->
    <link rel="preload" href="/fonts/literata-italic.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      /* Critical CSS - Above the fold styles */
      body {
        margin: 0;
        padding: 0;
        /* Тот же шрифт, что и в основных стилях: пока Figtree грузится,
           текст показывается системным, и чем ближе метрики, тем меньше дёргается */
        font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background-color: #EEF1F0;
        color: #1a1a1a;
      }

      #root {
        min-height: 100vh;
      }

      /* Prevent layout shift */
      img {
        max-width: 100%;
        height: auto;
      }

      /*
        Текст, который сборка кладёт внутрь #root: его видят робот, ChatGPT и
        мессенджер, потому что скрипты они не выполняют. React стирает этот
        блок в момент запуска (createRoot очищает контейнер).

        Скрывать его нельзя — скрытый текст для поисковика это нарушение.
        Поэтому оформляем как первый экран: пока грузится приложение, человек
        видит заголовок страницы, а не голый текст на белом.
      */
      #prerendered-content {
        max-width: 46rem;
        margin: 0 auto;
        padding: 22vh 1.5rem 0;
        font-family: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #1a1a1a;
      }
      #prerendered-content h1 {
        font-family: 'Literata', Georgia, serif;
        font-size: clamp(2.2rem, 6vw, 3.6rem);
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.02em;
        margin: 0 0 1rem;
      }
      #prerendered-content p {
        font-size: 1.05rem;
        line-height: 1.6;
        color: #55534f;
        margin: 0 0 0.9rem;
      }
      #prerendered-content nav,
      #prerendered-content address {
        display: block;
        font-size: 0.85rem;
        color: #8a8783;
        font-style: normal;
        margin-top: 1.2rem;
      }
      #prerendered-content nav a { color: #8a8783; margin-right: 1rem; }
      @media (prefers-color-scheme: dark) {
        /* Пока стили не загрузились, страница красится этим блоком. Без строки
           про body человек с тёмной темой видел вспышку светлого фона. */
        body { background-color: #191919; color: #EEF1F0; }
        #prerendered-content { color: #EEF1F0; }
        #prerendered-content p { color: #a8a5a0; }
      }
    </style>

    <!-- Запасной заголовок: генератор перекрывает его на каждой странице.
         Подробности правки 29 августа — в журнале, не здесь: комментарии из
         этого файла уезжают во все 123 собранные страницы. -->
    <title>Castells Media | Marketing agency for home service businesses</title>

    <!-- Google Tag Manager — uncomment when you have a real GTM ID -->
    <!-- GTM_ID: replace GTM-XXXXXXX with your real container ID, then uncomment both blocks -->
    <!--
    <script>
      (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
      new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
      'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer','GTM-XXXXXXX');
    </script>
    -->
    <!-- Счётчик посещений Castells (services/web/counter-script.mjs).
         Не ставит cookie и не хранит адрес посетителя: сервер считает
         суточный отпечаток, который нельзя связать со вчерашним. Поэтому
         баннер про cookie не нужен. Попадает во все страницы: пререндер
         берёт шаблоном dist/index.html, собранный из этого файла. -->
    <script defer src="https://services-dashboard-production.up.railway.app/c.js"></script>
  </head>
  <body>
    <!-- GTM noscript — uncomment when GTM is active -->
    <!-- <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript> -->

    <!--
      Снимаем офлайн-режим (Service Worker) и чистим его кэш.
      Раньше сайт ставил в браузер офлайн-копию, и посетители могли месяцами
      видеть старую версию вместо новой. Офлайн-режим отключён, а этот код
      добивает уже установленные копии у тех, кто заходил раньше.
    -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;

        var wasControlled = !!navigator.serviceWorker.controller;

        var cleanup = navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
        });

        if ('caches' in window) {
          cleanup = cleanup.then(function () {
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            });
          });
        }

        // Если страницу отдал старый офлайн-обработчик, один раз перезагружаемся,
        // чтобы посетитель сразу увидел актуальную версию. Флаг не даёт зациклиться.
        cleanup.then(function () {
          if (wasControlled && !sessionStorage.getItem('sw-purged')) {
            sessionStorage.setItem('sw-purged', '1');
            location.reload();
          }
        }).catch(function () {});
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
