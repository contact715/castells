<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/castells-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Castells Agency - We help contractors and service providers dominate their local markets through data-driven strategies." />

    <!-- Resource Hints for Performance -->
    <!-- Оба шрифта лежат у нас (/fonts). К чужим серверам за шрифтами не ходим:
         раньше основной текст ждал двух остановок на fontshare.com -->
    <link rel="dns-prefetch" href="https://player.vimeo.com" />

    <!-- Preload critical resources -->
    <link rel="preload" href="/castells-logo.webp" as="image" type="image/webp" />
    <!-- Заголовки первого экрана набраны Newsreader: грузим его сразу,
         не дожидаясь, пока браузер дочитает CSS и наткнётся на @font-face -->
    <link rel="preload" href="/fonts/newsreader-variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Главным элементом страницы (LCP) браузер считает абзац под заголовком,
         а он набран Manrope. После обрезки шрифт весит 14 КБ, так что грузить
         его заранее дешевле, чем ждать разбора стилей -->
    <link rel="preload" href="/fonts/manrope-variable.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      /* Critical CSS - Above the fold styles */
      body {
        margin: 0;
        padding: 0;
        /* Тот же шрифт, что и в основных стилях: пока Manrope грузится,
           текст показывается системным, и чем ближе метрики, тем меньше дёргается */
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background-color: #faf9f6;
        color: #1a1a1a;
      }

      #root {
        min-height: 100vh;
      }

      /* Prevent layout shift */
      img {
        max-width: 100%;
        height: auto;
      }
    </style>

    <title>Castells Agency | Dominate Your Market</title>

    <!-- Google Tag Manager — uncomment when you have a real GTM ID -->

      })(window,document,'script','dataLayer','GTM-XXXXXXX');
    </script>
    -->
  </head>
  <body>
    <!-- GTM noscript — uncomment when GTM is active -->
    <!-- <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript> -->

    <!--
      Снимаем офлайн-режим (Service Worker) и чистим его кэш.
      Раньше сайт ставил в браузер офлайн-копию, и посетители могли месяцами
      видеть старую версию вместо новой. Офлайн-режим отключён, а этот код
      добивает уже установленные копии у тех, кто заходил раньше.
    -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;

        var wasControlled = !!navigator.serviceWorker.controller;

        var cleanup = navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
        });

        if ('caches' in window) {
          cleanup = cleanup.then(function () {
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            });
          });
        }

        // Если страницу отдал старый офлайн-обработчик, один раз перезагружаемся,
        // чтобы посетитель сразу увидел актуальную версию. Флаг не даёт зациклиться.
        cleanup.then(function () {
          if (wasControlled && !sessionStorage.getItem('sw-purged')) {
            sessionStorage.setItem('sw-purged', '1');
            location.reload();
          }
        }).catch(function () {});
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
